version: '3.4'
name: paybank

services:
  paybank:
    image: ${DOCKER_REGISTRY-}paybank
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__BaseDB=Server=db;Database=PayBankDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Password123 -Q 'SELECT 1' -C || exit 1" ]
      interval: 10s
      retries: 10
      start_period: 60s

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./script.sql:/init.sql
    command: >
      /bin/bash -c " /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P YourStrong@Password123 -C -Q 'IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = \"PayBankDB\") BEGIN CREATE DATABASE PayBankDB; END' && /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P YourStrong@Password123 -C -d PayBankDB -i /init.sql "
