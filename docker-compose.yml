services:
  postgres:
    image: postgres:16
    container_name: file-sharing-postgres
    environment:
      POSTGRES_DB: file-sharing
      POSTGRES_USER: filesharinguser
      POSTGRES_PASSWORD: filesharingpass
    command:
      - -p
      - "4040"
    ports:
      - "4040:4040"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filesharinguser -d file-sharing -p 4040"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: file-sharing-app
    ports:
      - "7070:7070"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:4040/file-sharing
      SPRING_DATASOURCE_USERNAME: filesharinguser
      SPRING_DATASOURCE_PASSWORD: filesharingpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: