version: "3.9"

services:
  password_manager-app:
    image: passwd:latest
    ports:
      - "8080:8080"
    environment:
      - MongoDb__HostName=mongo_db
      - MongoDb__Port=27017
      - MongoDb__UserName=admin
      - MongoDb__Password=secret
      - MongoDb__DatabaseName=password_manager

  mongo_db:
    image: mongo:6.0
    container_name: mongo_db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
      - MONGO_INITDB_DATABASE=password_manager
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
