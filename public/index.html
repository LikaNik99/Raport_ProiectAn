<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Task Manager</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1><i class=""></i> Task Manager</h1>

        <div class="header-right">
          <!-- Dark Mode -->
          <div class="theme-toggle">
            <span>Dark Mode</span>
            <label class="switch">
              <input type="checkbox" id="theme-switch">
              <span class="slider round"></span>
            </label>
          </div>

          <!-- Clopoțel notificări (alb) -->
          <div class="header-separator"></div>
          <div class="notif-wrapper" style="position:relative;">
            <button id="notif-btn" class="icon-btn" title="Notificări" style="position:relative;background:transparent;border:none;cursor:pointer;">
              <i class="fa fa-bell" style="font-size:18px;color:#fff;"></i>
              <span id="notif-badge" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;border-radius:10px;padding:0 6px;font-size:11px;display:none;">0</span>
            </button>
            <div id="notif-panel" class="notif-panel" style="position:absolute;right:0;top:32px;width:340px;background:#fff;border:1px solid #eee;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,0.12);display:none;overflow:hidden;z-index:1000;">
              <div style="padding:10px 12px;font-weight:600;border-bottom:1px solid #eee;">Notificări</div>
              <div id="notif-list" style="max-height:320px;overflow-y:auto;"></div>
              <div style="padding:8px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end;">
                <button id="notif-mark-read" class="submit-btn" style="padding:6px 10px;font-size:12px;display:none;">Mark all read</button>
                <button id="notif-clear-all" class="submit-btn" style="padding:6px 10px;font-size:12px;background:#3379c9;">Clear all</button>
              </div>
            </div>
          </div>

          <!-- Profil utilizator -->
          <div class="header-separator"></div>
          <div class="user-section">
            <div class="user-avatar">
              <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="user" style="width:32px;height:32px;border-radius:50%;">
            </div>
            <span class="user-name">Utilizator</span>
            <button class="logout-btn" title="Logout">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="main-content">
      <aside class="sidebar">
        <div class="sidebar-menu">
          <button class="active" id="all-tasks"><i class="fas fa-list"></i> All Tasks</button>
          <button id="today-tasks"><i class="fas fa-calendar-day"></i> Today</button>
          <button id="important-tasks"><i class="fas fa-star"></i> Important</button>
          <button id="completed-tasks"><i class="fas fa-check-circle"></i> Completed</button>
          <button id="notes-tasks"><i class="fas fa-star-half-alt"></i> Notes</button>
        </div>

        <div class="projects-section">
          <h3>Projects</h3>
          <div class="projects-list" id="projects-list"></div>
          <button id="add-project-btn"><i class="fas fa-plus"></i> Add Project</button>
        </div>

        <div class="stats-section">
          <h3>Statistics</h3>
          <div class="stats-item">
            <span>Total Tasks</span>
            <span id="total-tasks-count">0</span>
          </div>
          <div class="stats-item">
            <span>Completed</span>
            <span id="completed-tasks-count">0</span>
          </div>
          <div class="stats-item">
            <span>Pending</span>
            <span id="pending-tasks-count">0</span>
          </div>

          <div style="margin-top:20px; text-align:center;">
            <canvas id="statusChart" width="200" height="200"></canvas>
          </div>
        </div>
      </aside>

      <main class="task-content">
        <div class="task-header">
          <h2 id="current-view">All Tasks</h2>
          <div class="task-actions">
            <div class="search-box">
              <input type="text" id="task-search" placeholder="Search tasks...">
              <i class="fas fa-search"></i>
            </div>
            <button id="add-task-btn"><i class="fas fa-plus"></i> Add Task</button>
            <button id="sort-tasks-btn"><i class="fas fa-sort"></i> Sort</button>
          </div>
        </div>

        <div class="task-filters">
          <div class="filter-item">
            <label for="priority-filter">Priority:</label>
            <select id="priority-filter">
              <option value="all">All</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="filter-item">
            <label for="date-filter">Due Date:</label>
            <select id="date-filter">
              <option value="all">All</option>
              <option value="today">Today</option>
              <option value="week">This Week</option>
              <option value="month">This Month</option>
              <option value="overdue">Overdue</option>
            </select>
          </div>
        </div>

        <div class="tasks-list" id="tasks-list">
          <div class="empty-state">
            <i class="fas fa-clipboard-list"></i>
            <p>No tasks found. Add a new task to get started!</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Task Modal -->
  <div class="modal" id="task-modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2 id="modal-title">Add New Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label for="task-title">Title*</label>
          <input type="text" id="task-title" required>
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date">
          </div>
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-project">Project</label>
            <select id="task-project">
              <option value="">No Project</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-labels">Labels (comma separated)</label>
            <input type="text" id="task-labels" placeholder="work, personal, urgent">
          </div>
        </div>
        <button type="submit" class="submit-btn">Save Task</button>
      </form>
    </div>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="project-modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Add New Project</h2>
      <form id="project-form">
        <div class="form-group">
          <label for="project-name">Project Name*</label>
          <input type="text" id="project-name" required>
        </div>
        <div class="form-group">
          <label for="project-color">Color</label>
          <input type="color" id="project-color" value="#4e73df">
        </div>
        <button id="create-project-btn" type="submit" class="submit-btn">Create Project</button>
      </form>
    </div>
  </div>

  <!-- Sort Modal -->
  <div class="modal" id="sort-modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Sort Tasks</h2>
      <div class="sort-options">
        <div class="sort-option">
          <input type="radio" id="sort-date" name="sort" value="dueDate" checked>
          <label for="sort-date">Due Date</label>
        </div>
        <div class="sort-option">
          <input type="radio" id="sort-priority" name="sort" value="priority">
          <label for="sort-priority">Priority</label>
        </div>
        <div class="sort-option">
          <input type="radio" id="sort-created" name="sort" value="createdAt">
          <label for="sort-created">Creation Date</label>
        </div>
        <div class="sort-option">
          <input type="radio" id="sort-title" name="sort" value="title">
          <label for="sort-title">Title</label>
        </div>
      </div>
      <div class="sort-order">
        <div class="sort-option">
          <input type="radio" id="order-asc" name="order" value="asc">
          <label for="order-asc">Ascending</label>
        </div>
        <div class="sort-option">
          <input type="radio" id="order-desc" name="order" value="desc" checked>
          <label for="order-desc">Descending</label>
        </div>
      </div>
      <button id="apply-sort-btn" class="submit-btn">Apply Sort</button>
    </div>
  </div>

  <!-- Rating Modal (Admin) -->
  <div class="modal" id="rating-modal" style="display:none;">
    <div class="modal-content" style="max-width:420px;">
      <span class="close-btn" id="rating-close">&times;</span>
      <h2>Rate Task</h2>
      <div id="rating-stars" style="display:flex;gap:8px;font-size:24px;color:#ccc;cursor:pointer;margin:10px 0;">
        <span data-star="1">★</span>
        <span data-star="2">★</span>
        <span data-star="3">★</span>
        <span data-star="4">★</span>
        <span data-star="5">★</span>
      </div>
      <div class="form-group">
        <label for="rating-comment">Comentariu (opțional)</label>
        <textarea id="rating-comment" rows="3" placeholder="Scrie un feedback scurt..."></textarea>
      </div>
      <button id="rating-submit" class="submit-btn">Trimite rating</button>
    </div>
  </div>

  <!-- App JS -->
  <script src="js.js"></script>

  <!-- Header helpers + Chart donut -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem("username") || "Utilizator";
      document.querySelector(".user-name").textContent = username;

      const role = localStorage.getItem("role") || "user";
      if (role !== "admin") {
        const addTaskBtn = document.getElementById("add-task-btn");
        if (addTaskBtn) addTaskBtn.style.display = "none";
        const addProjBtn = document.getElementById("add-project-btn");
        if (addProjBtn) addProjBtn.style.display = "none";
      }

      document.querySelector(".logout-btn").addEventListener("click", async () => {
        try { await fetch("/logout", { method: "POST" }); } catch(e) {}
        localStorage.removeItem("username");
        localStorage.removeItem("role");
        localStorage.removeItem("email");
        window.location.href = "/";
      });

      const themeSwitch = document.getElementById("theme-switch");
      themeSwitch.addEventListener("change", () => {
        document.body.classList.toggle("dark-mode", themeSwitch.checked);
      });
    });

    // Chart donut
    const ctx = document.getElementById('statusChart');
    const completedEl = document.getElementById('completed-tasks-count');
    const pendingEl = document.getElementById('pending-tasks-count');
    const statusChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Completed', 'Pending'],
        datasets: [{
          data: [
            parseInt(completedEl.textContent) || 0,
            parseInt(pendingEl.textContent) || 0
          ],
          backgroundColor: ['#1cc88a', '#4e73df'],
          hoverOffset: 8
        }]
      },
      options: { plugins: { legend: { position: 'bottom' } } }
    });
    const observer = new MutationObserver(() => {
      const completed = parseInt(completedEl.textContent) || 0;
      const pending = parseInt(pendingEl.textContent) || 0;
      statusChart.data.datasets[0].data = [completed, pending];
      statusChart.update();
    });
    observer.observe(completedEl, { childList: true });
    observer.observe(pendingEl, { childList: true });
  </script>
</body>
</html>
