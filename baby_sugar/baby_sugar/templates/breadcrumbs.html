{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="container mt-3">
  <ol class="breadcrumb mb-0">

    {% for crumb in breadcrumbs %}
      {% if forloop.last %}
        <li class="breadcrumb-item active">
          {{ crumb.label }}
        </li>
      {% else %}
        <li class="breadcrumb-item">
          <a href="{{ crumb.url }}" class="text-decoration-none">
            {{ crumb.label }}
          </a>
        </li>
      {% endif %}
    {% endfor %}

  </ol>
</nav>
{% endif %}
