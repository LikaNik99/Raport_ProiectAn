<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4 p-4">

      <h2 class="mb-4 text-center fw-bold text-chiffon">Log In</h2>

      <form method="post" action="{% url 'customer:login' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Username"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Parolă</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Parolă"
            required
          >
        </div>

        {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit" class="btn btn-mahogany w-100 mt-2">
          Autentificare
        </button>
      </form>

      <p class="text-center mt-3">
        Nu ai cont?
        <a href="{% url 'customer:register' %}" class="logo_text">
          Creează cont
        </a>
      </p>

    </div>
  </div>
</div>
