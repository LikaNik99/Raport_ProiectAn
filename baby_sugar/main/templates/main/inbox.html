{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="col">
<div class="row d-flex g-2 pb-4 px-2justify-content-center align-items-center text-center">
<h4 class="mb-3  gap-2 text-center ">
  Inbox
</h4>

<div class="mb-3 d-flex gap-2 align-items-center">

  <button
    form="bulk-form"
    formaction="{% url 'customer:mark_notifications_bulk' %}"
    class="btn btn-sm btn-success">
    Marchează ca citite
  </button>

  <button
    form="bulk-form"
    formaction="{% url 'customer:delete_notifications_bulk' %}"
    class="btn btn-sm btn-danger"
    onclick="return confirm('Ștergi notificările selectate?')">
    Șterge
  </button>
</div>

<form method="post" id="bulk-form" class="min-vh-100">
  {% csrf_token %}

  <div class="list-group" data-inbox="true">

    {% for n in notifications %}
      <div
        class="list-group-item {% if not n.is_read %}bg-vanilla{% endif %} border-0 border-bottom"
        data-id="{{ n.id }}"
      >

        <div class="d-flex justify-content-between align-items-start">

          <div class="d-flex gap-3">

            <!-- CHECKBOX -->
            <input
              type="checkbox"
              name="ids"
              value="{{ n.id }}"
            >

            <!-- CONTENT -->
            <div>

              <!-- TITLU CLICKABIL -->
              <a
                href="{% url 'customer:notification_detail' n.id %}"
                class="text-decoration-none"
              >
                <span class="{% if not n.is_read %}fw-bold{% endif %}">
                  {{ n.title }}
                </span>
              </a>

              <!-- TEXT -->
              <p class="mb-1 text-muted">
                {{ n.message }}
              </p>

              <!-- META -->
              <small class="text-secondary">
                {{ n.created_at|date:"d.m.Y H:i" }}
                · de la {{ n.sender }}
              </small>

            </div>
          </div>

        </div>
      </div>

    {% empty %}
      <div class="text-muted">Nu ai mesaje</div>
    {% endfor %}

  </div>
</form>
</div>
</div>

{% endblock %}
