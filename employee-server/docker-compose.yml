services:
  postgres:
    image: postgres:16-alpine
    container_name: logare-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: logare_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logare_db
      DB_USER: postgres
      DB_PASS: postgres
      SERVER_PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
